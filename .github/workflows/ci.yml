name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Python
        run: |
          python -m compileall -q comfydeploy
          python -m unittest discover -s tests -v
      - name: Check frontend syntax
        run: node --check comfydeploy/ui/app.js
      - name: Package smoke test
        run: |
          python -m pip install .
          comfydeploy catalog > /tmp/catalog.json
          comfydeploy plan --with studio > /tmp/plan.json
